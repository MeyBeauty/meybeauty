[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API redirects for Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Security Headers with CSP for Stripe
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://www.paypal.com https://www.sandbox.paypal.com https://d2skjte8udjqxw.cloudfront.net https://*.planity.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://d2skjte8udjqxw.cloudfront.net https://*.planity.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://www.pexels.com https://*.pexels.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net https://api.stripe.com https://m.stripe.network https://*.paypal.com https://*.paypalobjects.com https://api-adresse.data.gouv.fr https://api.cloudinary.com https://*.cloudinary.com https://d2skjte8udjqxw.cloudfront.net https://*.planity.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com https://*.paypal.com https://*.paypalobjects.com https://www.google.com https://maps.google.com https://*.firebaseapp.com https://*.planity.com; frame-ancestors 'self'; worker-src 'self' blob: https://js.stripe.com; font-src 'self' data: https://fonts.gstatic.com https://*.planity.com; object-src 'none'; base-uri 'self'; form-action 'self' https://www.paypal.com https://www.sandbox.paypal.com;"

# The Planity booking widget runs a large third-party app inside this page:
# it needs eval, websockets and many planity/firebase/stripe domains.
[[headers]]
  for = "/planity-embed.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src 'self' https:; frame-ancestors 'self'; worker-src 'self' data: blob: https:; font-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'self' https:;"
